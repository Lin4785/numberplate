<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>号码池查询 · 机动车号牌互联网选号系统</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="/">
        <span class="brand__mark">车牌</span>
        <span>机动车号牌互联网选号系统</span>
      </a>
      <nav class="topbar__nav">
        <a href="/">选号大厅</a>
        <a href="/query" class="is-active">号码池查询</a>
        <a href="/admin">管理后台</a>
      </nav>
    </div>
  </header>

  <main class="wrap wrap--narrow">
    <div class="card">
      <h2 class="card__title">号码池查询</h2>
      <p class="card__sub">查询某个号牌号码是否已被占用，以及它是否落在已投放的号段范围内。查询不消耗选号机会。</p>

      <div class="form-grid">
        <div class="field">
          <label class="field__label" for="q-number">号牌号码</label>
          <input class="input" id="q-number" placeholder="例如 京A12345 / 京AD12345" autocomplete="off" />
          <div class="field__help">分隔符可省略，字母不区分大小写。</div>
        </div>
        <div class="field">
          <label class="field__label" for="q-type">号牌种类（可选）</label>
          <select class="select" id="q-type"><option value="">不限</option></select>
        </div>
      </div>

      <div class="row">
        <button class="btn" id="q-submit">查询</button>
        <button class="btn btn--ghost" id="q-lucky">试一个靓号</button>
      </div>
    </div>

    <div id="q-result" class="mt-20"></div>
  </main>

  <div class="toast-host" id="toast-host"></div>
  <script type="module" src="/query.js"></script>
</body>
</html>
